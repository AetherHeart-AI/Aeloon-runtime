[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aeloon-core"
version = "0.1.0"
description = "Minimal Aeloon agent loop and terminal debugging CLI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "html2text>=2025.4.15",
  "httpx>=0.28",
  "loguru>=0.7",
  "anthropic>=0.75",
  "prompt-toolkit>=3.0.47",
  "pydantic>=2.11",
  "pyyaml>=6.0",
  "rich>=13.7",
  "tiktoken>=0.9",
]

[project.scripts]
aeloon-core = "aeloon_core.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["aeloon_core"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
