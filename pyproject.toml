[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aeloon-core"
version = "0.0.4"
description = "A stateless agent core with a stateful pure-Python runtime."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "charset-normalizer<3.4.8",
  "httpx>=0.28",
  "jsonschema>=4.26,<5",
  "markitdown[docx,pdf,pptx,xlsx]>=0.1.4,<0.2",
  "nodejs-wheel==22.13.0",
  "paddleocr[doc-parser]>=3.3,<4",
  "paddlepaddle>=3.2,<3.3",
  "pdfplumber>=0.11,<1",
  "pillow>=11.0",
  "pypdf>=6,<7",
  "pypdfium2>=4.30,<5",
  "pydantic>=2.11",
  "python-docx>=1.2,<2",
  "pyyaml>=6.0,<7",
  "reportlab>=4,<5",
  "rich>=14.0,<15",
]

[dependency-groups]
dev = [
  "datasets>=3.2,<4",
  "numpy>=1.26",
  "pytest>=9.0",
  "pytest-asyncio>=1.3",
  "ruff>=0.15",
  "tqdm>=4.66",
]
package = [
  "pyinstaller>=6.21,<7",
]

[project.scripts]
aeloon = "aeloon_core.__main__:main"
aeloon-core = "aeloon_core.__main__:main"

[tool.hatch.build]
artifacts = [
  "aeloon_core/resources/skills/pptx-generator/runtime/node_modules/**",
]

[tool.hatch.build.targets.wheel]
packages = ["aeloon_core"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
