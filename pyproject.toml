[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aeloon-core"
version = "0.0.10"
description = "A stateless agent core with a stateful pure-Python runtime."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28",
  "jsonschema>=4.26,<5",
  "openpyxl>=3.1,<4",
  "pillow>=11.0",
  "pypdf>=6,<7",
  "pypdfium2>=4.30,<5",
  "pydantic>=2.11",
  "python-docx>=1.2,<2",
  "python-pptx>=1.0,<2",
  "reportlab>=4.4,<5",
  "pyyaml>=6.0,<7",
  "rich>=14.0,<15",
]

[dependency-groups]
dev = [
  "datasets>=3.2,<4",
  "numpy>=1.26",
  "pytest>=9.0",
  "pytest-asyncio>=1.3",
  "ruff>=0.15",
  "tqdm>=4.66",
]
[project.scripts]
aeloon-core = "aeloon_core.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["aeloon_core"]

[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "benchmark: slow quality-baseline tests that execute document AI models",
  "integration: tests that prepare external runtimes or exercise system integrations",
]
