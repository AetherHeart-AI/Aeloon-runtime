[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aeloon-core"
version = "0.1.0"
description = "Conversation-scoped master-agent orchestration powered by Pydantic AI Harness."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28",
  "loguru>=0.7",
  "pydantic>=2.11",
  "pydantic-ai-slim[anthropic,openai]>=2.14.1,<3",
  "pydantic-ai-harness[dynamic-workflow]>=0.9,<0.10",
  # Harness 0.9 still imports MontyRepl, removed in pydantic-monty 0.0.19.
  "pydantic-monty>=0.0.16,<0.0.19",
]

[dependency-groups]
dev = [
  "pytest>=9.0",
  "pytest-asyncio>=1.3",
  "ruff>=0.15",
]

[project.scripts]
aeloon-core = "aeloon_core.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["aeloon_core"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
