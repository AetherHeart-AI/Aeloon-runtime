<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>Aeloon Core</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="appbar">
        <button class="brand" id="session-trigger" type="button" aria-haspopup="dialog">
          <span class="brand-mark">A</span><span>AELOON</span>
        </button>
        <span class="workspace-path" id="workspace-path">connecting…</span>
        <nav class="primary-nav" aria-label="主导航">
          <button class="nav-item active" data-view="chat" type="button">对话</button>
          <button class="nav-item" data-view="logs" type="button">Logs</button>
        </nav>
        <span class="appbar-spacer"></span>
        <span class="connection" id="connection" data-status="connecting">
          <span class="connection-dot"></span>
          <span id="connection-label">连接中</span>
        </span>
        <span class="model-tag" id="model-tag"></span>
      </header>

      <div class="session-popover hidden" id="session-popover" role="dialog" aria-label="会话">
        <div class="popover-head">
          <div>
            <span class="eyebrow">CURRENT SESSION</span>
            <strong id="current-session">—</strong>
          </div>
          <button class="icon-button" id="new-session" type="button" title="新会话">＋</button>
        </div>
        <div class="session-list" id="session-list"></div>
      </div>

      <main class="workspace">
        <section class="view view-chat active" id="view-chat" aria-label="对话">
          <div class="chat-column">
            <div class="chat-scroll" id="chat-scroll" aria-live="polite"></div>
            <form class="composer" id="composer">
              <div class="composer-row">
                <textarea
                  id="prompt-input"
                  rows="1"
                  placeholder="向 Aeloon 发消息…"
                  aria-label="消息"
                ></textarea>
                <button class="send-button" id="send-button" type="submit">
                  <span>发送</span><span aria-hidden="true">↗</span>
                </button>
              </div>
              <div class="command-menu hidden" id="command-menu" role="listbox"></div>
              <div class="composer-meta">
                <span id="queue-meta">准备就绪</span>
                <span>/ 命令 · Enter 发送 · Shift+Enter 换行</span>
              </div>
            </form>
          </div>

          <aside class="agents-pane" id="agents-pane" aria-label="当前 turn 的 agents">
            <div class="pane-head">
              <div>
                <span class="eyebrow">CURRENT TURN</span>
                <h2>Agents</h2>
              </div>
              <span class="agent-count" id="agent-count">0</span>
            </div>
            <p class="pane-note">仅存在于当前 turn；结束后不保存上下文或 checkpoint。</p>
            <div class="agents-empty" id="agents-empty">
              <span class="empty-glyph">◇</span>
              <p>需要并行或专业工作时，Harness agents 会出现在这里。</p>
            </div>
            <div class="agents-list" id="agents-list"></div>
          </aside>
        </section>

        <section class="view view-logs" id="view-logs" aria-label="运行日志">
          <div class="logs-head">
            <div>
              <span class="eyebrow">DIAGNOSTICS</span>
              <h1>运行日志</h1>
            </div>
            <span class="logs-note">原始事件只留在这里，不进入对话。</span>
          </div>
          <div class="log-filters" id="log-filters">
            <button class="filter-button active" data-filter="all" type="button">全部</button>
            <button class="filter-button" data-filter="warning" type="button">WARN+</button>
            <button class="filter-button" data-filter="error" type="button">ERROR</button>
            <button class="filter-button" data-filter="gateway" type="button">gateway</button>
          </div>
          <div class="logs-table" id="logs-table"></div>
        </section>
      </main>

      <div class="toast-region" id="toast-region" aria-live="assertive"></div>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
