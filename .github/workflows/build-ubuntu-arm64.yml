name: Build Ubuntu arm64 binary (glibc 2.35)

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ubuntu-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
          python-version: "3.12"

      - name: Verify glibc compatibility baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.35"

      - name: Build single-file executable
        run: >-
          uv run --isolated --frozen --no-default-groups
          --group package --python 3.12
          pyinstaller --clean --noconfirm aeloon.spec

      - name: Verify executable and bundled resources
        shell: bash
        run: |
          set -euo pipefail
          file dist/aeloon | grep -E "ELF 64-bit LSB.*ARM aarch64"
          ldd dist/aeloon
          dist/aeloon --version
          dist/aeloon --help >/dev/null
          dist/aeloon bridge schema | python3 -m json.tool >/dev/null

      - name: Verify standalone daemon lifecycle
        shell: bash
        run: |
          set -euo pipefail
          smoke_root="$(mktemp -d /tmp/aeloon-smoke.XXXXXX)"
          mkdir -p "$smoke_root/home"
          config_path="$smoke_root/config.json"
          data_path="$smoke_root/data"
          socket_path="$smoke_root/bridge.sock"
          binary_path="$GITHUB_WORKSPACE/dist/aeloon"

          stop_daemon() {
            env -i HOME="$smoke_root/home" PATH=/usr/bin:/bin TMPDIR=/tmp \
              "$binary_path" bridge stop \
              --config "$config_path" \
              --data-dir "$data_path" \
              --socket "$socket_path" >/dev/null 2>&1 || true
          }
          trap stop_daemon EXIT

          env -i HOME="$smoke_root/home" PATH=/usr/bin:/bin TMPDIR=/tmp \
            "$binary_path" bridge ensure \
            --config "$config_path" \
            --data-dir "$data_path" \
            --socket "$socket_path"
          env -i HOME="$smoke_root/home" PATH=/usr/bin:/bin TMPDIR=/tmp \
            "$binary_path" bridge status \
            --config "$config_path" \
            --data-dir "$data_path" \
            --socket "$socket_path"

          test "$(find "$data_path/skills" -maxdepth 3 -type f | wc -l | tr -d ' ')" = "8"
          stop_daemon
          trap - EXIT
          test ! -e "$socket_path"

      - name: Create release archive and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          tar -czf release/aeloon-ubuntu-arm64-glibc2.35.tar.gz -C dist aeloon
          cd release
          sha256sum aeloon-ubuntu-arm64-glibc2.35.tar.gz \
            > aeloon-ubuntu-arm64-glibc2.35.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aeloon-ubuntu-arm64-glibc2.35-${{ github.sha }}
          path: |
            release/aeloon-ubuntu-arm64-glibc2.35.tar.gz
            release/aeloon-ubuntu-arm64-glibc2.35.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish tagged release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aeloon-ubuntu-arm64-glibc2.35-${{ github.sha }}
          path: release

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          elif ! gh release create "$GITHUB_REF_NAME" release/* --generate-notes; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          fi
