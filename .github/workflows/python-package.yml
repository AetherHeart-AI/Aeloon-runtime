name: Runtime Python package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test wheel and bundled resources
    strategy:
      matrix:
        os: [macos-15, ubuntu-22.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv run --frozen pytest -q
      - run: uv run --frozen ruff check .
      - run: uv run --frozen python tools/gen_v4_manifest.py --check
      - run: uv run --frozen python tools/gen_rpc_docs.py --check
      - run: uv run --frozen python tools/gen_ts_protocol.py --check
      - name: Build and install the wheel
        shell: bash
        run: |
          set -euo pipefail
          uv build --wheel --out-dir dist
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel"
          expected_version="$(uv run --frozen python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          uv venv --python 3.12 wheel-smoke
          uv pip install --python wheel-smoke/bin/python "$wheel"
          test "$(AELOON_RUNTIME_MODE=1 wheel-smoke/bin/python -m aeloon_runtime --version)" = "aeloon-runtime ${expected_version}"
          test -x wheel-smoke/bin/aeloon-runtime
          test ! -e wheel-smoke/bin/aeloon
          test "$(wheel-smoke/bin/aeloon-runtime --version)" = "aeloon-runtime ${expected_version}"
          wheel-smoke/bin/aeloon-runtime serve --help >/dev/null
          test -f "aeloon_runtime/resources/skills/aeloon-office-lite/SKILL.md"
          test -f "aeloon_runtime/resources/skills/aeloon-office-lite/scripts/cli.py"
