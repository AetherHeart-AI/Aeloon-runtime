name: Core Python package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test wheel and bundled resources
    strategy:
      matrix:
        os: [macos-15, ubuntu-22.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv run --frozen pytest -q
      - run: uv run --frozen ruff check .
      - name: Build and install the wheel
        shell: bash
        run: |
          set -euo pipefail
          uv build --wheel --out-dir dist
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel"
          uv venv --python 3.12 wheel-smoke
          uv pip install --python wheel-smoke/bin/python "$wheel"
          test "$(wheel-smoke/bin/python -m aeloon_core --version)" = "aeloon 0.0.6"
          wheel-smoke/bin/python -m aeloon_core rpc serve --help >/dev/null
          for skill_id in document-reader word-docx powerpoint-pptx; do
            test -f "aeloon_core/resources/skills/$skill_id/SKILL.md"
            test -f "aeloon_core/resources/skills/$skill_id/scripts/cli.py"
          done
