name: Build macOS arm64 binary

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Build single-file executable
        run: >-
          uv run --isolated --frozen --no-default-groups
          --group package --python 3.12
          pyinstaller --clean --noconfirm aeloon.spec

      - name: Verify executable and bundled resources
        shell: bash
        run: |
          set -euo pipefail
          file dist/aeloon | grep -F "Mach-O 64-bit executable arm64"
          codesign --verify --deep --strict dist/aeloon
          dist/aeloon --version
          dist/aeloon --help >/dev/null
          dist/aeloon bridge schema | python3 -m json.tool >/dev/null

      - name: Verify standalone daemon lifecycle
        shell: bash
        run: |
          set -euo pipefail
          smoke_root="$(mktemp -d /tmp/aeloon-smoke.XXXXXX)"
          mkdir -p "$smoke_root/home"
          config_path="$smoke_root/config.json"
          data_path="$smoke_root/data"
          socket_path="$smoke_root/bridge.sock"
          binary_path="$GITHUB_WORKSPACE/dist/aeloon"

          stop_daemon() {
            env -i HOME="$smoke_root/home" PATH=/usr/bin:/bin TMPDIR=/tmp \
              "$binary_path" bridge stop \
              --config "$config_path" \
              --data-dir "$data_path" \
              --socket "$socket_path" >/dev/null 2>&1 || true
          }
          trap stop_daemon EXIT

          env -i HOME="$smoke_root/home" PATH=/usr/bin:/bin TMPDIR=/tmp \
            "$binary_path" bridge ensure \
            --config "$config_path" \
            --data-dir "$data_path" \
            --socket "$socket_path"
          env -i HOME="$smoke_root/home" PATH=/usr/bin:/bin TMPDIR=/tmp \
            "$binary_path" bridge status \
            --config "$config_path" \
            --data-dir "$data_path" \
            --socket "$socket_path"

          for skill_id in \
            office ppt document-writing reports markitdown pdf \
            paddleocr-doc-parsing pptx-generator document-format-skills; do
            test -f "$data_path/skills/$skill_id/SKILL.md"
          done
          for skill_id in \
            markitdown pdf paddleocr-doc-parsing pptx-generator document-format-skills; do
            test -f "$data_path/skills/$skill_id/LICENSE.txt"
          done
          test -f "$data_path/skills/office/scripts/preflight.py"
          test -f "$data_path/skills/markitdown/scripts/convert.py"
          test -f "$data_path/skills/pdf/scripts/render_pdf.py"
          test -f "$data_path/skills/paddleocr-doc-parsing/scripts/local_parse.py"
          test -f "$data_path/skills/pptx-generator/scripts/render_slides.py"
          test -f "$data_path/skills/document-format-skills/scripts/process.py"
          stop_daemon
          trap - EXIT
          test ! -e "$socket_path"

      - name: Create release archive and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          tar -czf release/aeloon-macos-arm64.tar.gz -C dist aeloon
          cd release
          shasum -a 256 aeloon-macos-arm64.tar.gz > aeloon-macos-arm64.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aeloon-macos-arm64-${{ github.sha }}
          path: |
            release/aeloon-macos-arm64.tar.gz
            release/aeloon-macos-arm64.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish tagged release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: aeloon-macos-arm64-${{ github.sha }}
          path: release

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* --generate-notes
          fi
